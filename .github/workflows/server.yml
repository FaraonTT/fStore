name: fStore server

# Серверная часть fStore. Запускается, когда приложение создаёт зашифрованный запрос (issue).
# Все проверки прав, сессии и пароли обрабатываются здесь, а не в приложении.

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fstore-api
  cancel-in-progress: false

jobs:
  api:
    # только запросы от владельца репозитория (токен приложения принадлежит ему)
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process requests
        run: node server/index.js
        env:
          GH_TOKEN: ${{ github.token }}
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
