name: Build fStore APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'apps/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      FSTORE_TOKEN: ${{ secrets.FSTORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode keystore
        run: base64 -d fstore.keystore.b64 > fstore.keystore

      - name: Build release APK
        shell: bash
        env:
          KS_PASS: fstore123
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fStore-1.2b.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fStore-1.2b
          path: fStore-1.2b.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2b
          name: fStore 1.2b
          files: fStore-1.2b.apk
          body: |
            fStore 1.2b — плавающий док, настройки, загрузки внутри приложения, AMOLED, лимит APK 300 МБ.
            Установи APK и зарегистрируй аккаунт void_fworld.

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          { grep -nE "^e: |error:|FAILED|What went wrong|Caused by" -A4 build.log | head -150; echo ----; tail -n 40 build.log; } > /tmp/log.txt || true
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan buildlog
          git reset -q
          cp /tmp/log.txt build-log.txt
          git add build-log.txt
          git commit -q -m "build log"
          git push -f origin buildlog
