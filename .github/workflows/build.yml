name: Build fStore APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'apps/**'
      - 'server/**'
      - '.github/workflows/server.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
      DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Server public key
        env:
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
        run: |
          if [ -n "$SERVER_SECRET" ]; then
            echo "FSTORE_SERVER_PUB=$(node server/pubkey.js)" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > fstore.keystore
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore fstore.keystore -storepass "$P" -keypass "$P" -alias fstore \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=fStore"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fStore-1.2b.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fStore-1.2b
          path: fStore-1.2b.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2b
          name: fStore 1.2b
          files: fStore-1.2b.apk
          body: |
            fStore 1.2b — безопасный сервер на GitHub Actions, вкладки «Загрузки» и «Настройки».

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          { grep -nE "^e: |error:|FAILED|What went wrong|Caused by" -A4 build.log | head -150; echo ----; tail -n 40 build.log; } > /tmp/log.txt || true
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan buildlog
          git reset -q
          cp /tmp/log.txt build-log.txt
          git add build-log.txt
          git commit -q -m "build log"
          git push -f origin buildlog
