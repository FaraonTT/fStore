<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fStore</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
  main{padding:24px;max-width:420px}
  a.btn{display:block;margin:14px 0;padding:14px 18px;border-radius:28px;background:#8ab4ff;color:#111;text-decoration:none;font-weight:600}
  a.alt{color:#8ab4ff}
</style>
</head>
<body>
<main>
  <h1>fStore</h1>
  <p id="msg">Открываю приложение…</p>
  <a class="btn" id="open" href="#">Открыть в fStore</a>
  <a class="alt" href="https://github.com/FaraonTT/fStore/releases">Нет приложения? Скачать fStore</a>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var id = q.get('app');
  var path = id ? 'app/' + encodeURIComponent(id) : 'music';
  var intent = 'intent://' + path + '#Intent;scheme=fstore;package=com.fworld.fstore;end';
  document.getElementById('open').href = intent;
  setTimeout(function () { location.href = intent; }, 300);
</script>
</body>
</html>
